
name: Inspect DhammaYaungKhay ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ZIP contents
        run: |
          echo "ZIP FILES:"
          find . -maxdepth 2 -type f
          echo "EXTRACTING:"
          mkdir -p project
          unzip -o ./*.zip -d project
          echo "PROJECT FILES:"
          find project -name gradlew -o -name settings.gradle -o -name build.gradle
          echo "DIRECTORIES:"
          find project -maxdepth 4 -type d
